<ons-page>
    
    <ons-toolbar>
    <div class="left">
        <ons-toolbar-button id="layers-button" class="home-toolbar-action" aria-label="Слои">
            <ons-icon class="icon" icon="md-layers"></ons-icon>
        </ons-toolbar-button>
    </div>
    <div class="center">
        Карта
    </div>

    <div class="right">
        <ons-toolbar-button id="side-menu-button" class="home-toolbar-action" aria-label="Меню" onclick="fn.openMenu()">
            <ons-icon class="icon" icon="md-menu"></ons-icon>
        </ons-toolbar-button>
    </div>
    </ons-toolbar>

    <img class='crosshair' src='../resources/crosshair.png'>
    <div id="map-container"></div>

    <div id="downbar-wrapper">
        <ons-button modifier="quiet" onclick="carousel_prev()"><ons-icon icon="md-arrow-left" class="icon button-icon"></ons-icon></ons-button>
        <ons-carousel overscrollable auto-scroll direction="horizontal" item-width="80px" swipeable id="draw-bar"></ons-carousel>
        <ons-button modifier="quiet" onclick="carousel_next()"><ons-icon icon="md-arrow-right" class="icon button-icon"></ons-icon></ons-button>
    </div>

    <ons-carousel overscrollable auto-scroll direction="horizontal" item-width="33%" swipeable id="draw-instrument-bar" class="downbar">
        <ons-carousel-item>
            <ons-button modifier="quiet" class="carousel-item-content" id="instrument-draw-center" onclick="drawInstrumentCenter()">
                <p class="carousel-button-text">Центр карты</p>
            </ons-button>
        </ons-carousel-item>
        <ons-carousel-item>
            <ons-button modifier="quiet" class="carousel-item-content" id="intrument-draw-gps" onclick="drawInstrumentGPS()">
                <p class="carousel-button-text">Местонахождение устройства</p>
            </ons-button>
        </ons-carousel-item>
        <ons-carousel-item>
            <ons-button modifier="quiet" class="carousel-item-content" id="instrument-draw-coordinate" onclick="showDrawInstrumentDialog()">
                <p class="carousel-button-text">Координаты</p>
            </ons-button>
        </ons-carousel-item>
    </ons-carousel>

    <template id="carousel-item">
        <ons-carousel-item>
            <ons-button class="carousel-item-content" modifier="quiet">
            </ons-button>
          </ons-carousel-item>
    </template>

    <template id="coordinate-search-template">
        <ons-dialog id="coordinate-search-dialog" cancelable>
            <div class="coordinate-search-header">
                <h2>Переход по координатам WGS-84</h2>
                <button type="button" class="coordinate-search-close" aria-label="Закрыть">
                    <span aria-hidden="true">×</span>
                </button>
            </div>
            <form class="coordinate-search-form" novalidate>
                <label for="coordinate-search-latitude">Широта, °</label>
                <input id="coordinate-search-latitude" name="latitude" type="text" inputmode="decimal"
                       autocomplete="off" placeholder="55.751244" aria-describedby="coordinate-search-error">
                <label for="coordinate-search-longitude">Долгота, °</label>
                <input id="coordinate-search-longitude" name="longitude" type="text" inputmode="decimal"
                       autocomplete="off" placeholder="37.618423" aria-describedby="coordinate-search-error">
                <label class="coordinate-search-mode">
                    <input type="radio" name="scaleMode" value="list" checked>
                    Масштаб из списка
                </label>
                <select id="coordinate-search-scale" name="scale">
                    <option value="500000">1 см = 500 км</option>
                    <option value="100000">1 см = 100 км</option>
                    <option value="50000">1 см = 50 км</option>
                    <option value="10000">1 см = 10 км</option>
                    <option value="5000">1 см = 5 км</option>
                    <option value="1000">1 см = 1 км</option>
                    <option value="500">1 см = 500 м</option>
                    <option value="100">1 см = 100 м</option>
                </select>
                <div class="coordinate-search-custom">
                    <label class="coordinate-search-mode">
                        <input type="radio" name="scaleMode" value="custom">
                        Пользовательский масштаб
                    </label>
                    <label for="coordinate-search-distance">1 см на карте = расстояние в метрах</label>
                    <input id="coordinate-search-distance" name="distance" type="text" inputmode="decimal"
                           value="1000" disabled aria-describedby="coordinate-search-error">
                </div>
                <p id="coordinate-search-error" class="coordinate-search-error" role="alert" hidden></p>
                <div class="coordinate-search-actions">
                    <button type="button" class="coordinate-search-cancel">Отмена</button>
                    <button type="submit">Перейти</button>
                </div>
            </form>
        </ons-dialog>
    </template>

    <template id="dialog_features">
        <ons-dialog id="dialog-features">
                <ons-toolbar class="dialog-toolbar">
                    <div class="center dialog-toolbar-content">
                        Выбранные элементы
                    </div>
                    <div class="right">
                        <ons-toolbar-button onclick="hideDialog('dialog-features')">
                            <ons-icon icon="md-close" class="icon dialog-close"></ons-icon>
                        </ons-toolbar-button>
                    </div>
                </ons-toolbar>
                <div > 
                <ons-list id="dialog-features-content">
                </ons-list>
                </div>
        </ons-dialog>
    </template>

    <template id="dialog_draw_instrument_coordinate">
        <ons-dialog id="dialog-draw-instrument-coordinate">
                <ons-toolbar class="dialog-toolbar">
                    <div class="center dialog-toolbar-content">
                        Координаты
                    </div>
                    <div class="right">
                        <ons-toolbar-button onclick="hideDialog('dialog-draw-instrument-coordinate')">
                            <ons-icon icon="md-close" class="icon dialog-close"></ons-icon>
                        </ons-toolbar-button>
                    </div>
                </ons-toolbar>
                <div class="dialog-draw-instrument-coordinate-content">
                    <p>Введите координаты:</p>
                    <div class="dialog-draw-instrument-coordinate-block">
                        <div class="coordinate-block">
                            <span class="coordinate-label">Долгота:</span>
                            <ons-input id="Y-value" class="coordinate-input" modifier="underbar" type="number" float value="0"></ons-input>
                        </div>
                        <div class="coordinate-block">
                            <span class="coordinate-label">Широта:</span>
                            <ons-input id="X-value" class="coordinate-input" modifier="underbar" type="number" float value="0"></ons-input>
                        </div>
                    </div>
                    <ons-button modifier="quiet" onclick="drawInstrumentCoordinate()" style="float:right;">Установить</ons-button>
                    <ons-button modifier="quiet" onclick="hideDialog('dialog-draw-instrument-coordinate')" style="float:right;">Отмена</ons-button>
                </div>
        </ons-dialog>
    </template>

    <script>
    ons.getScriptPage().onInit = function() {
        showMap();
        createDrawBar();

        this.querySelector('#layers-button').onclick = function() {
            document.querySelector('#myNavigator').pushPage('./views/layers.html');
        };

        this.onShow = function() { 
            transformUIToOrientation();
            map.updateSize();
            createDrawBar();
        };
    };
    </script>
</ons-page>
