<ons-page>
    <ons-toolbar>
        <div class="left">
            <ons-toolbar-button>
                <ons-back-button id="feature-properties-back-button">Back</ons-back-button>
            </ons-toolbar-button>
        </div>
        <div class="center" id="title">
            <div class="feature-properties-heading">
                <div class="feature-properties-main-title"></div>
                <div id="feature-properties-title"></div>
            </div>
        </div>
    </ons-toolbar>
    <div id="featureProperties" >
        <div id="local-map"></div>
        <div id="table"></div>
        <div id="photos">
        </div>
    </div>

    <ons-carousel direction="horizontal" item-width="20%" swipeable id="feature-instruments">
        <ons-carousel-item class="carousel-button">
            <ons-button modifier="large" class="instruments-item-content" id="feature-instrument-map" aria-label="Показать на карте" title="Показать на карте">
                <img class="signature feature-instrument-icon" src="./resources/images/assets/showOnMap.png" alt="">
            </ons-button>
        </ons-carousel-item>
        <ons-carousel-item class="carousel-button">
            <ons-button modifier="large" class="instruments-item-content" id="feature-instrument-edit">
                <ons-icon class="signature" icon="md-edit"></ons-icon>
            </ons-button>
        </ons-carousel-item>
        <ons-carousel-item class="carousel-button">
            <ons-button modifier="large" class="instruments-item-content" id="feature-instrument-edit-geometry" aria-label="Редактировать геометрию" title="Редактировать геометрию">
                <img class="signature feature-instrument-icon" src="./resources/images/assets/editGeometry.png" alt="">
            </ons-button>
        </ons-carousel-item>
        <ons-carousel-item class="carousel-button">
            <ons-button modifier="large" class="instruments-item-content" id="feature-instrument-delete" aria-label="Удалить объект" title="Удалить объект">
                <img class="signature feature-instrument-icon" src="./resources/images/assets/delete.png" alt="">
            </ons-button>
        </ons-carousel-item>
        <ons-carousel-item class="carousel-button">
            <ons-button modifier="large" class="instruments-item-content" id="feature-instrument-export" aria-label="Экспортировать объект в KML" title="Экспортировать объект в KML">
                <img class="signature feature-instrument-icon" src="./resources/images/assets/exportNAV.png" alt="">
            </ons-button>
        </ons-carousel-item>
    </ons-carousel>

    <div class="feature-under-bar" id="save-modification-bar">
        <ons-button id="cancelModification" class="feature-modification-button">
            Отменить изменения
        </ons-button>
        <ons-button id="saveModificationFeature" class="feature-modification-button">
            Сохранить
        </ons-button>
    </div>

    <script>

        ons.getScriptPage().onInit = function() {
            featurePropertiesScript(this.data.feature, this.data.clickCoordinate);
        }

    </script>
</ons-page>
