<ons-page>
    <ons-toolbar>
        <div class="left">
          <ons-toolbar-button>
              <ons-back-button>Back</ons-back-button>
          </ons-toolbar-button>
        </div>
        <div class="center">
          <div class="new-feature-heading">
            <div id="new-feature-layer-title"></div>
            <div id="new-feature-geometry-info"></div>
          </div>
        </div>
      </ons-toolbar>
      <div id="add-feature-content" class="page-content">
      </div>

      <div class="under-bar" id="save-feature-bar">
        <ons-button id='saveFeatureButton' class="feature-action-button" style="float:right; margin: 1%;">
          <img src="./resources/images/assets/save.png" alt="">
          <span>Сохранить</span>
        </ons-button>
        <ons-button id="backButton" class="feature-action-button" style="float:right; margin: 1%;">
          <img src="./resources/images/assets/delete.png" alt="">
          <span>Удалить</span>
        </ons-button>
      </div>

      <template id="photogallery">
        <div id="photos">
          <button type="button" id="addNewPhoto" class="new-feature-photo-button">
              <div>
                  <ons-icon icon="md-plus" size="30px"></ons-icon>
                  <p>Нажмите, чтобы<br/>добавить фотографию</p>
              </div>
          </button>
        </div>
      </template>

      <script>
        ons.getScriptPage().onInit = function() {
            transformUIToOrientation();
            let layer = this.data.layer;
            let feature = this.data.feature;
            const fromMap = this.data.fromMap;
            newFeatureScipt(layer, feature, fromMap);
        }

      </script>
</ons-page>
