 <ons-page>
    <ons-toolbar>
        <div class="left">
            <ons-toolbar-button>
                <ons-back-button>Back</ons-back-button>
            </ons-toolbar-button>
        </div>
        <div class="center" id="title">
            Таблица
        </div>
        <div class="right">
            <ons-toolbar-button id="features-actions-button" aria-label="Действия с объектами" aria-haspopup="menu" aria-controls="features-actions-menu" aria-expanded="false">
                <ons-icon class="icon" icon="md-more-vert"></ons-icon>
            </ons-toolbar-button>
        </div>
    </ons-toolbar>
    <div class="features-page-content">
        <div id="features-count" class="features-count">Объектов в слое: …</div>
        <div class="features-scroll-container">
            <div id="features-list"></div>
            <div class="features-scrollbar" aria-hidden="true" hidden>
                <div class="features-scrollbar-thumb"></div>
            </div>
        </div>
    </div>

    <template id="dialog_search">
        <ons-dialog id="dialog-search">
                <ons-toolbar class="dialog-toolbar">
                    <div class="center dialog-toolbar-content">
                        Фильтр
                    </div>
                    <div class="right">
                        <ons-toolbar-button onclick="hideDialog('dialog-search')">
                            <ons-icon icon="md-close" class="icon dialog-close"></ons-icon>
                        </ons-toolbar-button>
                    </div>
                </ons-toolbar>
                <div class="dialog-search-content">
                    <div class="column-filter">
                        <label id="filter-label" for="filter-value"></label>
                        <div id="filter-control"></div>
                    </div>
                    <div class="dialog-search-actions">
                        <ons-button id="clear-filter-button">Сбросить</ons-button>
                        <ons-button id="accept-filter-button">Найти</ons-button>
                    </div>
                </div>
        </ons-dialog>
    </template>


    <script>
        ons.getScriptPage().onInit = function() {
            featuresInit(this.data.layerID);
        }
    </script>
</ons-page>
